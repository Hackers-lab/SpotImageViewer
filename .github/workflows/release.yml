name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Locate Spec File and Build with PyInstaller
        id: pyinstaller_build
        shell: pwsh
        run: |
          $spec = Get-ChildItem -Path packaging -Filter "SpotImageViewer*.spec" | Select-Object -First 1
          if (-not $spec) {
            Write-Error "Spec file not found in packaging directory."
            exit 1
          }
          Write-Host "Building using spec file: $($spec.FullName)"
          python -m PyInstaller --noconfirm $spec.FullName
          
          $distFolder = Get-ChildItem -Path dist -Directory | Where-Object { $_.Name -like "SpotImageViewer*" } | Select-Object -First 1
          if (-not $distFolder) {
            Write-Error "PyInstaller dist output folder not found."
            exit 1
          }
          Write-Host "Created dist folder: $($distFolder.FullName)"
          $zipPath = "dist\$($distFolder.Name).zip"
          Compress-Archive -Path "$($distFolder.FullName)\*" -DestinationPath $zipPath -Force
          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          echo "dist_name=$($distFolder.Name)" >> $env:GITHUB_OUTPUT

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          $setupExe = Get-ChildItem -Path "Output" -Filter "SpotImageViewer_Setup*.exe" | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "SpotImageViewer_Setup*.exe was not created in Output directory."
            exit 1
          }
          Write-Host "Created installer: $($setupExe.FullName)"
          # Also create unversioned copy for backward compatibility
          Copy-Item $setupExe.FullName "Output\SpotImageViewer_Setup.exe" -Force

      - name: Calculate SHA-256 Checksum
        id: sha256
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path "Output" -Filter "SpotImageViewer_Setup_v*.exe" | Select-Object -First 1
          if (-not $setupExe) { $setupExe = Get-Item "Output\SpotImageViewer_Setup.exe" }
          $hash = (Get-FileHash $setupExe.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "Setup.exe ($($setupExe.Name)) SHA256: $hash"
          echo "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/SpotImageViewer_Setup*.exe
            dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

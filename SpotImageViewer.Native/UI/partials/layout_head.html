<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot Image Viewer & Verification Studio — v20.56</title>
  <script>
    window.__pageLoadT0 = performance.now();
    window.__logPerf = function(stage, details) {
      var elapsed = (performance.now() - window.__pageLoadT0).toFixed(1);
      console.log('[PERF-UI] +' + elapsed + 'ms | ' + stage + ' | ' + (details || ''));
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.log_perf_client) {
          window.pywebview.api.log_perf_client('UI_' + stage, parseFloat(elapsed), details || '');
        }
      } catch (e) {}
    };
    window.__logPerf('HEAD_START', 'HTML head evaluation begun');

    window.__capturedErrors = [];
    window.onerror = function(msg, url, line, col, error) {
      window.__capturedErrors.push({ msg: msg, url: url, line: line, col: col, error: String(error) });
    };
    window.addEventListener('unhandledrejection', function(e) {
      window.__capturedErrors.push({ msg: 'Unhandled Rejection: ' + (e.reason ? (e.reason.message || e.reason) : e), error: String(e.reason) });
    });
    // Restore theme BEFORE page renders to prevent flash
    (function(){
      var t = localStorage.getItem('siv_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
    // Fallback safe Lucide stub in case script evaluation is delayed
    window.lucide = window.lucide || { createIcons: function() {} };
  </script>
  <style>
    html, body {
      background-color: #0f172a !important;
      color: #f1f5f9 !important;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
  </style>
  <link rel="stylesheet" href="css/tailwind.min.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/lucide.min.js" charset="UTF-8"></script>
  <script>window.__logPerf('LUCIDE_LOADED');</script>
</head>
<body class="app-shell bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col overflow-hidden h-screen w-screen select-none transition-colors duration-300">

  <!-- Universal Top Navigation Bar / Full-Width Top Bar (At the Very Top) -->
  <header class="app-topbar h-[44px] border-b border-slate-200 dark:border-slate-800/80 px-4 flex items-center justify-between bg-white/90 dark:bg-[#181818]/90 backdrop-blur-md z-30 shrink-0 w-full">
    <!-- Left Section: Sidebar Toggle -->
    <div class="flex items-center gap-2.5 shrink-0 min-w-[140px]">
      <button onclick="toggleSidebar()" id="sidebarCollapseBtn" title="Toggle sidebar" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i data-lucide="panel-left" class="w-4 h-4"></i>
      </button>
      <span class="text-xs font-semibold text-slate-700 dark:text-slate-300 select-none tracking-tight">SpotImageViewer</span>
    </div>

    <!-- Center Section: Larger, Centered Universal Search Bar (Limited to Image Viewer tab) -->
    <div id="viewerHeaderActions" class="flex items-center justify-center gap-2 flex-1 max-w-xl mx-auto">
      <div class="relative w-full max-w-lg">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search Consumer ID, Meter, Name, or Mobile..." 
          class="w-full pl-10 pr-24 py-1.5 bg-slate-100/70 dark:bg-[#121212] border border-slate-200 dark:border-slate-800 rounded-md text-xs text-slate-900 dark:text-slate-200 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/30 transition-all shadow-inner"
          onkeydown="if(event.key === 'Enter') handleSearch(); if(event.key === ' ' && this.value.trim() === '') { event.preventDefault(); showSearchHistoryDropdown(); }"
          onfocus="showSearchHistoryDropdown()"
          onclick="showSearchHistoryDropdown()"
          oninput="toggleSearchClearBtn()"
          autocomplete="off"
        />
        <div class="absolute inset-y-1 right-1 flex items-center gap-1">
          <button id="btnSearchClear" onclick="clearSearchInput()" class="hidden p-1 text-rose-400 hover:text-rose-600 dark:text-rose-500 dark:hover:text-rose-300 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded transition" title="Clear search">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
          <button onclick="handleSearch()" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white text-[11px] font-semibold rounded transition shadow-sm">
            Find
          </button>
        </div>

        <!-- Search History Dropdown Popover -->
        <div id="searchHistoryDropdown" class="hidden absolute top-full left-0 right-0 mt-1.5 rounded-xl z-50 p-2 shadow-2xl space-y-1 animate-in fade-in zoom-in-95 duration-100" style="background: var(--surface-0); border: 1px solid var(--border-strong);">
          <div class="flex items-center justify-between px-2 py-1 border-b border-slate-100 dark:border-slate-800/80 text-[10px] font-semibold text-slate-400">
            <span class="flex items-center gap-1"><i data-lucide="history" class="w-3 h-3"></i> Recent Searches</span>
            <button onclick="closeSearchHistoryDropdown(event)" class="hover:text-slate-200"><i data-lucide="x" class="w-3 h-3"></i></button>
          </div>
          <div id="searchHistoryList" class="max-h-48 overflow-y-auto space-y-0.5">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </div>

    <!-- Right Section: + | REFRESH | ? | DARK TOGGLE | COUNTS -->
    <div class="flex items-center gap-1.5 shrink-0 justify-end min-w-[160px]">
      <!-- + (Add Consumer Master Excel Popover) -->
      <div class="relative inline-block">
        <button id="btnImportToggle" onclick="toggleImportPopover(event)" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Add Consumer Master Excel Data (+)">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>

        <!-- Inline Notification-style Popover Menu (Matches Studio Industrial Dark/Light Theme) -->
        <div id="importPopover" class="hidden absolute right-0 mt-2 w-80 rounded-xl z-50 p-3.5 space-y-3 animate-in fade-in zoom-in-95 duration-150">
          <div class="popover-header flex items-center justify-between pb-2.5">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
                <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
              </div>
              <span class="text-xs font-bold text-slate-100 dark:text-slate-100" style="color: var(--text);">Consumer Database</span>
            </div>
            <button onclick="closeImportPopover()" class="text-slate-400 hover:text-slate-200 p-0.5 rounded transition">
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>

          <p class="text-[11px] leading-relaxed" style="color: var(--text-3);">
            Upload consumer records into local SQLite cache or download the template.
          </p>

          <div class="space-y-2">
            <!-- 1. Download Template -->
            <button onclick="generateConsumerTemplate(); closeImportPopover();" class="popover-item w-full p-2.5 transition flex items-center justify-between gap-2 text-left group">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded bg-sky-500/15 text-sky-400 flex items-center justify-center shrink-0 group-hover:scale-105 transition">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i>
                </div>
                <div>
                  <span class="text-xs font-semibold block leading-tight" style="color: var(--text);">Download Template</span>
                  <span class="text-[10px]" style="color: var(--text-3);">Blank formatted Excel file</span>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5" style="color: var(--text-3);"></i>
            </button>

            <!-- 2. Upload Excel -->
            <button onclick="importConsumerData(); closeImportPopover();" class="popover-item w-full p-2.5 transition flex items-center justify-between gap-2 text-left group">
              <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0 group-hover:scale-105 transition">
                  <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                </div>
                <div>
                  <span class="text-xs font-semibold block leading-tight" style="color: var(--text);">Upload Excel File</span>
                  <span class="text-[10px]" style="color: var(--text-3);">.xlsx / .xls or .csv</span>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5" style="color: var(--text-3);"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- REFRESH (Reload Image Index) -->
      <button id="btnReloadIndex" onclick="startIndexing()" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Reload Image Index">
        <i id="reloadIndexIcon" data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>

      <!-- FOLDERS (Network Folders Popover) -->
      <div class="relative inline-block">
        <button id="btnFolderToggle" onclick="toggleFolderPopover(event)" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Manage Image Folders">
          <i data-lucide="folder" class="w-4 h-4"></i>
        </button>

        <!-- Inline Folder Management Popover Menu -->
        <div id="folderPopover" class="hidden absolute right-0 mt-2 w-96 rounded-xl z-50 p-3.5 space-y-3 animate-in fade-in zoom-in-95 duration-150" style="background: var(--surface-0); border: 1px solid var(--border-strong); box-shadow: 0 16px 40px rgba(0,0,0,.45);">
          <div class="flex items-center justify-between pb-2.5" style="border-bottom: 1px solid var(--border);">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded bg-purple-500/15 text-purple-400 flex items-center justify-center">
                <i data-lucide="folder-cog" class="w-3.5 h-3.5"></i>
              </div>
              <span class="text-xs font-bold" style="color: var(--text);">Image Directories</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="addFolder()" class="px-2 py-1 bg-purple-600 hover:bg-purple-500 text-white rounded text-[11px] font-semibold flex items-center gap-1 transition shadow-sm">
                <i data-lucide="plus" class="w-3 h-3"></i> Add
              </button>
              <button onclick="closeFolderPopover()" class="text-slate-400 hover:text-slate-200 p-0.5 rounded transition">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>

          <p class="text-[11px] leading-relaxed" style="color: var(--text-3);">
            Active image directories scanned during search and index operations.
          </p>

          <!-- Topbar Folders List Container -->
          <div id="topbarFolderList" class="space-y-1.5 max-h-48 overflow-y-auto pr-0.5">
            <!-- Dynamically populated -->
          </div>

          <div class="pt-2 flex items-center justify-between" style="border-top: 1px solid var(--border);">
            <button onclick="startIndexing(); closeFolderPopover();" class="text-[11px] text-sky-500 hover:text-sky-400 font-semibold flex items-center gap-1.5">
              <i data-lucide="refresh-cw" class="w-3 h-3"></i> Re-index Now
            </button>
            <button onclick="switchTab('settings'); switchSettingsSection('folders'); closeFolderPopover();" class="text-[11px] text-slate-400 hover:text-slate-200 font-medium">
              Advanced Settings &rarr;
            </button>
          </div>
        </div>
      </div>

      <!-- ? (Help & User Guide) -->
      <button onclick="openHelpModal()" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="User Guide & Help (?)">
        <i data-lucide="help-circle" class="w-4 h-4"></i>
      </button>

      <!-- DARK TOGGLE (Theme Selector) -->
      <button id="themeToggleBtn" onclick="toggleTheme()" class="w-7 h-7 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Toggle Dark / Light Mode">
        <i id="themeIcon" data-lucide="sun" class="w-4 h-4"></i>
      </button>

      <!-- Vertical Separator Divider -->
      <span class="h-4 w-px bg-slate-200 dark:bg-slate-800 mx-1" aria-hidden="true"></span>

      <!-- Live Indexing Progress Pill Badge -->
      <div id="topIndexStatusBadge" class="hidden items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-500/10 dark:bg-amber-500/15 border border-amber-500/30 text-amber-600 dark:text-amber-400 text-[11px] font-medium animate-pulse" title="Scanning & Indexing Images...">
        <i data-lucide="refresh-cw" class="w-3 h-3 animate-spin"></i>
        <span id="topIndexStatusText">Indexing...</span>
      </div>

      <!-- COUNTS (Database Image Count with pulsing dot) -->
      <div id="statImagesContainer" class="flex items-center gap-1.5 text-xs font-semibold text-slate-700 dark:text-slate-300 select-none pl-0.5 cursor-pointer" onclick="toggleFolderPopover(event)" title="Indexed Database Count">
        <span id="statImagesDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
        <span id="statImages">0</span>
      </div>
    </div>

    <!-- Top Loading Timeline Nanobar -->
    <div id="topIndexTimeline" class="hidden absolute bottom-0 left-0 right-0 h-[2.5px] bg-slate-200/50 dark:bg-slate-800/50 overflow-hidden z-40">
      <div id="topIndexTimelineBar" class="h-full bg-gradient-to-r from-sky-500 via-amber-500 to-emerald-500 w-0 transition-all duration-300"></div>
    </div>
  </header>

  <!-- Middle Work Body: Sidebar + Main Content -->
  <div class="flex-1 flex overflow-hidden w-full relative">

    <!-- Left Ultra-Slim Icon Rail (VS Code / Photoshop Style, expands on hover) -->
    <aside id="sidebar" class="sidebar shrink-0 bg-white dark:bg-[#181818] border-r border-slate-200 dark:border-slate-800/80 flex flex-col justify-between py-2 z-20 select-none">
      <!-- Navigation Tabs -->
      <nav class="flex flex-col items-start gap-1 w-full px-1.5" id="navContainer">
        <button onclick="switchTab('viewer')" class="nav-item active" data-tab="viewer" title="Image Viewer">
          <i data-lucide="image" class="w-4 h-4 text-sky-500 shrink-0"></i>
          <span class="nav-label">Image Viewer</span>
        </button>
        <button onclick="switchTab('bill')" class="nav-item" data-tab="bill" title="Bill Calculator">
          <i data-lucide="zap" class="w-4 h-4 text-amber-500 shrink-0"></i>
          <span class="nav-label">Bill Calculator</span>
        </button>
        <button onclick="switchTab('theft')" class="nav-item" data-tab="theft" title="Theft Assessment">
          <i data-lucide="scale" class="w-4 h-4 text-rose-500 shrink-0"></i>
          <span class="nav-label">Theft Assessment</span>
        </button>
        <button onclick="switchTab('audit')" class="nav-item" data-tab="audit" title="Low Consumption Audit">
          <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-500 shrink-0"></i>
          <span class="nav-label">Low Cons. Audit</span>
        </button>

        <!-- Tools -->
        <button onclick="switchTab('fuzzy')" class="nav-item" data-tab="fuzzy" title="Fuzzy Lookup">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-500 shrink-0"></i>
          <span class="nav-label">Fuzzy Lookup</span>
        </button>
        <button onclick="switchTab('osd')" class="nav-item" data-tab="osd" title="OSD Report Studio">
          <i data-lucide="file-check-2" class="w-4 h-4 text-cyan-500 shrink-0"></i>
          <span class="nav-label">OSD Report</span>
        </button>
        <button onclick="switchTab('dcrc')" class="nav-item" data-tab="dcrc" title="Agency PO & DCRC Billing">
          <i data-lucide="receipt" class="w-4 h-4 text-emerald-500 shrink-0"></i>
          <span class="nav-label">DCRC & PO Billing</span>
        </button>
      </nav>

      <!-- Bottom Settings Action -->
      <div class="flex flex-col items-start w-full px-1.5 pt-2 border-t border-slate-100 dark:border-slate-800/60">
        <button onclick="switchTab('settings')" class="nav-item" data-tab="settings" title="Global Settings">
          <i data-lucide="settings" class="w-4 h-4 text-indigo-400 shrink-0"></i>
          <span class="nav-label">Settings</span>
        </button>
      </div>
    </aside>

    <!-- Main Content View Area -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-100/50 dark:bg-slate-950/40 relative overflow-hidden">

    <!-- TAB 1: Modern Image Viewer & Inspection Studio -->
